function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset() * 60000;
  return new Date(d - off).toISOString().slice(0,10);
}

function tagLabel(kind){
  if (kind === 'lecture') return 'Лекция';
  if (kind === 'practice') return 'Практика';
  return null;
}

function render(){
  const container = document.getElementById('days');
  const today = todayISO();
  container.innerHTML = WEEK.map(day => {
    const isToday = day.date === today;
    const lessonsHtml = day.lessons.map(l => {
      const label = tagLabel(l.kind);
      const tagHtml = label ? `<span class="tag ${l.kind}">${label}</span>` : '';
      const subjectsHtml = l.subjects.map(s => {
        const entriesHtml = s.entries.map(e =>
          `<div class="entry">ауд. <b>${e.room}</b> · ${e.teacher}</div>`
        ).join('');
        return `<div class="subject">${s.name}</div>${entriesHtml}`;

      return `
        <div class="lesson">
          <div class="time">${l.start}\u2013${l.end}</div>
          <div class="lesson-body">${tagHtml}${subjectsHtml}</div>
        </div>`;
    }).join('');
    return `

  }).join('');
